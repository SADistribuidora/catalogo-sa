<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&A Distribuidora Automotiva — Categorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #1B1E24;
    --warehouse: #F2EFE8;
    --card: #FFFFFF;
    --torque: #479A4A;
    --torque-dark: #357238;
    --line: #E1DCD1;
    --ink: #1B1E24;
    --ink-soft: #565C64;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--warehouse);
    color: var(--ink);
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

  header {
    background: #000;
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo-img { height: 40px; width: auto; }
  nav { display: flex; align-items: center; gap: 26px; }
  nav a { color: #C7CBD1; font-size: 13.5px; font-weight: 500; }
  nav a:hover { color: #fff; }
  .btn-whatsapp {
    background: var(--torque);
    color: #fff !important;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .btn-whatsapp:hover { background: var(--torque-dark); }

  .page-header {
    background: #000;
    padding: 40px 0;
    text-align: center;
  }
  .page-eyebrow {
    color: var(--torque);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .page-header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #fff;
    margin-bottom: 10px;
  }
  .page-header p { color: #A9AFB8; font-size: 14px; }

  .toolbar {
    max-width: 1140px;
    margin: 0 auto;
    padding: 22px 24px 0;
  }
  #searchCatInput {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: #fff;
  }

  .grid-wrap { max-width: 1140px; margin: 0 auto; padding: 20px 24px 60px; }
  .stat-pill { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .tile {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 4/3;
    background: var(--card);
    border: 1px solid var(--line);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(27,30,36,0.12); }
  .tile img { width: 100%; height: 100%; object-fit: contain; padding: 14px; }
  .tile-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    background: linear-gradient(135deg, #EDE9DF 0%, #E3DED2 100%);
    color: #B5AF9E;
  }
  .tile-label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 26px 10px 8px;
    text-align: center;
  }
  .tile-count {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--torque);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .tile:hover .tile-label { background: linear-gradient(to top, var(--torque-dark), rgba(53,114,56,0)); }

  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 0; }

  @media (max-width: 900px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
  }

  footer {
    background: #000;
    color: #8B929C;
    padding: 24px 0;
    text-align: center;
    font-size: 12px;
  }
  footer a { color: var(--torque); }
</style>
</head>

<div class="page-header">
  <div class="page-eyebrow">Navegue por categoria</div>
  <h1>Escolha uma categoria</h1>
  <p>Clique numa categoria pra ver só os produtos dela</p>
</div>

<div class="toolbar">
  <input type="text" id="searchCatInput" placeholder="Buscar categoria... ex: Alarme, Som, Vidro">
</div>

<div class="grid-wrap">
  <div class="stat-pill" id="statPill"></div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Nenhuma categoria encontrada.</div>
</div>

<footer>
  <div class="container">
    © <span id="anoAtual"></span> S&amp;A Distribuidora Automotiva — <a href="/catalogo/">Ver catálogo completo</a>
  </div>
</footer>

<script>
document.getElementById("anoAtual").textContent = new Date().getFullYear();

const API = "/.netlify/functions/products";
const ICONE_PADRAO = "🔧";
const ICONES_CATEGORIA = {
  "Fios": "⚡", "Cabo": "⚡", "Chicotes": "⚡", "Conector": "⚡",
  "Led": "💡", "Lampada": "💡", "Super Led": "💡",
  "Antena": "📡", "Alarmes": "🔔", "Controles De Alarmes": "🔔",
  "Bateria": "🔋", "Contra Frente": "🎵", "Radio Mp5": "🎵",
  "Alto Falantes": "🎵", "Reparo Tw": "🎵",
  "Trava Porta": "🔒", "Bloqueador Botao": "🔒",
  "Capota": "🚙", "Calha": "🚙", "Engate": "🚙", "Retrovisor": "🚙",
  "Camera": "📷", "Friso": "🔧", "Maquina Vidro": "⚙️", "Modulo Vidro": "⚙️",
};
function iconePara(categoria) { return ICONES_CATEGORIA[categoria] || ICONE_PADRAO; }

let categorias = [];
let termo = "";

async function carregar() {
  document.getElementById("statPill").textContent = "Carregando categorias...";
  let produtos;
  try {
    const res = await fetch(API);
    produtos = await res.json();
  } catch (e) {
    document.getElementById("statPill").textContent = "Erro ao carregar. Recarregue a página.";
    return;
  }

  const mapa = {};
  produtos.forEach(p => {
    if (!mapa[p.categoria]) {
      mapa[p.categoria] = { nome: p.categoria, count: 0, fotoUrl: null };
    }
    mapa[p.categoria].count += 1;
    if (!mapa[p.categoria].fotoUrl && p.fotoUrl) {
      mapa[p.categoria].fotoUrl = p.fotoUrl;
    }
  });

  categorias = Object.values(mapa).sort((a, b) => b.count - a.count);
  render();
}

function render() {
  const t = termo.trim().toLowerCase();
  const filtradas = categorias.filter(c => !t || c.nome.toLowerCase().includes(t));

  document.getElementById("statPill").textContent = `${filtradas.length} categorias`;

  const grid = document.getElementById("catGrid");
  const empty = document.getElementById("emptyMsg");

  if (filtradas.length === 0) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  empty.style.display = "none";

  grid.innerHTML = filtradas.map(c => `
    <a class="tile" href="/catalogo/?categoria=${encodeURIComponent(c.nome)}">
      <span class="tile-count">${c.count}</span>
      ${c.fotoUrl
        ? `<img src="${c.fotoUrl}" alt="${c.nome}" loading="lazy">`
        : `<div class="tile-placeholder">${iconePara(c.nome)}</div>`}
      <div class="tile-label">${c.nome}</div>
    </a>
  `).join("");
}

document.getElementById("searchCatInput").addEventListener("input", (e) => {
  termo = e.target.value;
  render();
});

carregar();
</script>
