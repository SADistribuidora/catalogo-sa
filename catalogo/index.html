<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&A Distribuidora Automotiva — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #1B1E24;
    --asphalt-2: #262B33;
    --warehouse: #F2EFE8;
    --card: #FFFFFF;
    --torque: #479A4A;
    --torque-dark: #357238;
    --safety: #F0A800;
    --safety-bg: #FDF2D9;
    --steel: #545B66;
    --steel-light: #8890999;
    --line: #E1DCD1;
    --ink: #1B1E24;
    --ink-soft: #565C64;
    --ok-bg: #E6F0E0;
    --ok-text: #386626;
    --low-bg: #FCEAD6;
    --low-text: #A0530A;
    --out-bg: #F5E1E1;
    --out-text: #A32D2D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--warehouse);
    color: var(--ink);
  }
  .topbar {
    background: #000000;
    color: #fff;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .topbar span { color: #C7CBD1; }
  .header {
    background: #000000;
    padding: 22px 24px 20px;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    height: 44px;
    width: auto;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    color: #fff;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .brand-sub {
    font-size: 11px;
    color: #9AA2AC;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .search-wrap {
    flex: 1;
    min-width: 240px;
    max-width: 460px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: #33383F;
    color: #fff;
  }
  .search-wrap input::placeholder { color: #8B929C; }
  .search-wrap input:focus { outline: 2px solid var(--torque); }
  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #8B929C;
    font-size: 15px;
  }
  .cart-btn {
    background: var(--torque);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cart-btn:hover { background: var(--torque-dark); }

  .filters {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 24px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--torque); color: var(--torque); }
  .filter-chip.active {
    background: var(--asphalt);
    border-color: var(--asphalt);
    color: #fff;
  }

  .filter-select {
    padding: 9px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    min-width: 180px;
  }
  .filter-select:focus { outline: 2px solid var(--torque); }

  .load-more-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 48px;
    text-align: center;
  }
  .load-more-btn {
    padding: 12px 28px;
    border-radius: 7px;
    border: 1px solid var(--asphalt);
    background: #fff;
    color: var(--asphalt);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .quote-thumb-fallback {
    width: 44px;
    height: 44px;
    background: var(--warehouse);
    border: 1px solid var(--line);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .load-more-btn:hover { background: var(--asphalt); color: #fff; }

  .results-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px 4px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .results-bar strong { color: var(--ink); }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px 24px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(27,30,36,0.10); transform: translateY(-2px); }
  .card-photo {
    height: 130px;
    background: linear-gradient(135deg, #EDE9DF 0%, #E3DED2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #B5AF9E;
    font-size: 34px;
    position: relative;
  }
  .stock-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .stock-ok { background: var(--ok-bg); color: var(--ok-text); }
  .stock-low { background: var(--low-bg); color: var(--low-text); }
  .stock-out { background: var(--out-bg); color: var(--out-text); }
  .card-body {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .card-cat {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--torque);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card-name {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    min-height: 38px;
  }
  .card-sku {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--steel);
    background: var(--warehouse);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 4px;
    width: fit-content;
    letter-spacing: 0.02em;
  }
  .card-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 6px;
  }
  .card-price {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
  }
  .card-price small {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .add-btn {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    border: 1px solid var(--asphalt);
    background: var(--asphalt);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-btn:hover { background: var(--torque); border-color: var(--torque); }
  .add-btn:disabled {
    background: #E1DCD1;
    border-color: #E1DCD1;
    color: #A39D8C;
    cursor: not-allowed;
  }

  .empty {
    max-width: 1100px;
    margin: 40px auto;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 0 24px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 40;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .quote-panel {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    max-width: 90vw;
    height: 100%;
    background: #fff;
    box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transition: right 0.25s ease;
  }
  .quote-panel.open { right: 0; }

  .quote-header {
    padding: 18px 20px;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .quote-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 17px;
  }
  .quote-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }

  .quote-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .quote-empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 40px 24px;
    line-height: 1.6;
  }

  .quote-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .quote-row-info { flex: 1; min-width: 0; }
  .quote-row-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .quote-row-sku {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--steel);
    margin-top: 3px;
  }
  .quote-row-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .qty-btn {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--warehouse);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-value {
    font-size: 13px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }
  .quote-row-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .quote-row-price {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
  }
  .quote-row-remove {
    background: none;
    border: none;
    color: var(--out-text);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  .quote-footer {
    border-top: 1px solid var(--line);
    padding: 16px 20px 20px;
    display: none;
  }
  .quote-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .quote-total-row strong {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    color: var(--torque);
  }
  .quote-actions {
    display: flex;
    gap: 8px;
  }
  .quote-action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--asphalt);
  }
  .quote-action-btn.primary {
    background: var(--asphalt);
    color: #fff;
  }
  .quote-action-btn.primary:hover { background: #000; }
  .quote-action-btn.secondary {
    background: #fff;
    color: var(--asphalt);
  }
  .quote-action-btn.secondary:hover { background: var(--warehouse); }
  .quote-note {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 10px;
    line-height: 1.4;
  }

  #printArea { display: none; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px;
    }
  }
</style>
</head>

const ICONE_PADRAO = "&#128295;";
const ICONES_CATEGORIA = {
  "Fios": "&#9889;", "Cabo": "&#9889;", "Chicotes": "&#9889;", "Conector": "&#9889;",
  "Led": "&#128161;", "Lampada": "&#128161;", "Super Led": "&#128161;",

  "Alto Falantes": "&#127925;", "Reparo Tw": "&#127925;",
  "Trava Porta": "&#128273;", "Bloqueador Botao": "&#128273;",
  "Capota": "&#128663;", "Calha": "&#128663;", "Engate": "&#128663;", "Retrovisor": "&#128663;",
  "Camera": "&#128247;", "Friso": "&#128295;", "Maquina Vidro": "&#9881;", "Modulo Vidro": "&#9881;",
};

function iconePara(categoria) {
  return ICONES_CATEGORIA[categoria] || ICONE_PADRAO;
}

const categorias = ["Todas", ...Array.from(new Set(produtos.map(p => p.categoria))).sort()];
const marcasList = ["Todas", ...Array.from(new Set(produtos.map(p => p.marca))).sort()];

let filtroCategoria = "Todas";
let filtroMarca = "Todas";
let busca = "";
const PAGE_SIZE = 60;
let visiveis = PAGE_SIZE;

const catSelect = document.getElementById("catSelect");
const marcaSelect = document.getElementById("marcaSelect");
const gridEl = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
const resultsBarEl = document.getElementById("resultsBar");
const loadMoreWrap = document.getElementById("loadMoreWrap");
const loadMoreBtn = document.getElementById("loadMoreBtn");

catSelect.innerHTML = categorias.map(c => `<option value="${c}">${c === "Todas" ? "Todas as categorias" : c}</option>`).join("");
marcaSelect.innerHTML = marcasList.map(m => `<option value="${m}">${m === "Todas" ? "Todas as marcas" : m}</option>`).join("");

catSelect.addEventListener("change", () => { filtroCategoria = catSelect.value; visiveis = PAGE_SIZE; renderGrid(); });
marcaSelect.addEventListener("change", () => { filtroMarca = marcaSelect.value; visiveis = PAGE_SIZE; renderGrid(); });

function fmtMoeda(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function estoqueBadge(qtd) {
  if (qtd === 0) return { cls: "stock-out", label: "Sem estoque" };
  if (qtd <= 5) return { cls: "stock-low", label: "Estoque baixo" };
  return { cls: "stock-ok", label: "Em estoque" };
}

function produtosFiltrados() {
  const termo = busca.trim().toLowerCase();
  return produtos.filter(p => {
    const matchCat = filtroCategoria === "Todas" || p.categoria === filtroCategoria;
    const matchMarca = filtroMarca === "Todas" || p.marca === filtroMarca;
    const matchBusca = !termo || p.nome.toLowerCase().includes(termo) || p.sku.toLowerCase().includes(termo) || p.marca.toLowerCase().includes(termo);
    return matchCat && matchMarca && matchBusca;
  });
}

function renderGrid() {
  const filtrados = produtosFiltrados();

  resultsBarEl.innerHTML = `<strong>${filtrados.length}</strong> produto${filtrados.length === 1 ? '' : 's'} encontrado${filtrados.length === 1 ? '' : 's'} de ${produtos.length} no total`;

  if (filtrados.length === 0) {
    gridEl.style.display = "none";
    emptyEl.style.display = "block";
    loadMoreWrap.style.display = "none";
    return;
  }
  gridEl.style.display = "grid";
  emptyEl.style.display = "none";

  const pagina = filtrados.slice(0, visiveis);

  gridEl.innerHTML = pagina.map(p => {
    const st = estoqueBadge(p.estoque);
    const fotoUrl = fotoIds.has(Number(p.id)) ? `imagens/${p.id}.jpg` : null;
    const fotoHtml = fotoUrl
      ? `<img src="${fotoUrl}" alt="${p.nome}" loading="lazy" style="width:100%;height:100%;object-fit:contain;background:#fff;" onerror="this.outerHTML='<span>${iconePara(p.categoria)}</span>';">`
      : `<span>${iconePara(p.categoria)}</span>`;
    return `
      <div class="card">
        <div class="card-photo">
          <span class="stock-badge ${st.cls}">${st.label}</span>
          ${fotoHtml}
        </div>
        <div class="card-body">
          <div class="card-cat">${p.categoria} · ${p.marca}</div>
          <div class="card-name">${p.nome}</div>
          <span class="card-sku">${p.sku}</span>
          <div class="card-footer">
            <div></div>
            <button class="add-btn" data-id="${p.id}" ${p.estoque === 0 ? 'disabled' : ''} title="Adicionar à lista">+</button>
          </div>
        </div>
      </div>
    `;
  }).join("");

  loadMoreWrap.style.display = filtrados.length > visiveis ? "block" : "none";
}

loadMoreBtn.addEventListener("click", () => {
  visiveis += PAGE_SIZE;
  renderGrid();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  busca = e.target.value;
  visiveis = PAGE_SIZE;
  renderGrid();
});

// Lê parâmetros vindos da landing (?categoria=X&busca=Y)
const urlParams = new URLSearchParams(window.location.search);
const catUrl = urlParams.get('categoria');
const buscaUrl = urlParams.get('busca');
if (catUrl && categorias.includes(catUrl)) {
  filtroCategoria = catUrl;
  catSelect.value = catUrl;
}
if (buscaUrl) {
  busca = buscaUrl;
  document.getElementById("searchInput").value = buscaUrl;
}

renderGrid();

// ---- Lista de orçamento ----
let orcamento = {}; // id -> {produto, qtd}

const orcamentoBtn = document.getElementById("orcamentoBtn");
const orcamentoCount = document.getElementById("orcamentoCount");
const overlay = document.getElementById("overlay");
const quotePanel = document.getElementById("quotePanel");
const quoteClose = document.getElementById("quoteClose");
const quoteItemsEl = document.getElementById("quoteItems");
const quoteEmptyEl = document.getElementById("quoteEmpty");
const quoteFooterEl = document.getElementById("quoteFooter");

function findProduto(id) {
  return produtos.find(p => String(p.id) === String(id));
}

function openPanel() {
  overlay.classList.add("open");
  quotePanel.classList.add("open");
}
function closePanel() {
  overlay.classList.remove("open");
  quotePanel.classList.remove("open");
}
orcamentoBtn.addEventListener("click", openPanel);
quoteClose.addEventListener("click", closePanel);
overlay.addEventListener("click", closePanel);

function addToOrcamento(id) {
  if (!orcamento[id]) {
    orcamento[id] = { produto: findProduto(id), qtd: 1 };
  } else {
    orcamento[id].qtd += 1;
  }
  renderOrcamento();
  openPanel();
}

function alterarQtd(id, delta) {
  if (!orcamento[id]) return;
  orcamento[id].qtd += delta;
  if (orcamento[id].qtd <= 0) delete orcamento[id];
  renderOrcamento();
}

function removerItem(id) {
  delete orcamento[id];
  renderOrcamento();
}

function renderOrcamento() {
  const ids = Object.keys(orcamento);
  orcamentoCount.textContent = ids.reduce((sum, i) => sum + orcamento[i].qtd, 0);

  if (ids.length === 0) {
    quoteItemsEl.innerHTML = "";
    quoteEmptyEl.style.display = "block";
    quoteFooterEl.style.display = "none";
    return;
  }
  quoteEmptyEl.style.display = "none";
  quoteFooterEl.style.display = "block";

  quoteItemsEl.innerHTML = ids.map(id => {
    const { produto, qtd } = orcamento[id];
    const fotoUrl = fotoIds.has(Number(id)) ? `imagens/${id}.jpg` : null;
    const thumb = fotoUrl
      ? `<img src="${fotoUrl}" loading="lazy" style="width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:5px;flex-shrink:0;" onerror="this.outerHTML='&lt;div class=quote-thumb-fallback&gt;${iconePara(produto.categoria)}&lt;/div&gt;';">`
      : `<div class="quote-thumb-fallback">${iconePara(produto.categoria)}</div>`;
    return `
      <div class="quote-row">
        ${thumb}
        <div class="quote-row-info">
          <div class="quote-row-name">${produto.nome}</div>
          <div class="quote-row-sku">${produto.sku} · ${produto.marca}</div>
          <div class="quote-row-controls">
            <button class="qty-btn" onclick="alterarQtd('${id}', -1)">-</button>
            <span class="qty-value">${qtd}</span>
            <button class="qty-btn" onclick="alterarQtd('${id}', 1)">+</button>
          </div>
        </div>
        <div class="quote-row-right">
          <button class="quote-row-remove" onclick="removerItem('${id}')">remover</button>
        </div>
      </div>
    `;
  }).join("");

  const totalItens = ids.reduce((sum, i) => sum + orcamento[i].qtd, 0);
  document.getElementById("quoteItemCountLabel").textContent = `${totalItens} ite${totalItens === 1 ? 'm' : 'ns'} na lista`;
}

document.getElementById("grid").addEventListener("click", (e) => {
  const btn = e.target.closest(".add-btn");
  if (btn && !btn.disabled) {
    addToOrcamento(btn.dataset.id);
  }
});

function montarTextoLista() {
  const ids = Object.keys(orcamento);
  let texto = "Olá! Gostaria de um orçamento para os seguintes produtos:\n\n";
  ids.forEach(id => {
    const { produto, qtd } = orcamento[id];
    texto += `${qtd}x  [${produto.sku}]  ${produto.nome}\n`;
  });
  return texto;
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const ids = Object.keys(orcamento);
  if (ids.length === 0) return;
  navigator.clipboard.writeText(montarTextoLista()).then(() => {
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copiado!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});

const WHATSAPP_NUMERO = "556232057740";

document.getElementById("whatsappBtn").addEventListener("click", () => {
  const ids = Object.keys(orcamento);
  if (ids.length === 0) return;
  const texto = encodeURIComponent(montarTextoLista());
  window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${texto}`, "_blank");
});
</script>

<div class="overlay" id="overlay"></div>
<div class="quote-panel" id="quotePanel">
  <div class="quote-header">
    <div class="quote-title">Lista de orçamento</div>
    <button class="quote-close" id="quoteClose">&times;</button>
  </div>
  <div class="quote-items" id="quoteItems"></div>
  <div class="quote-empty" id="quoteEmpty">Nenhum item adicionado ainda.<br>Clique no "+" dos produtos pra montar seu orçamento.</div>
  <div class="quote-footer" id="quoteFooter">
    <div class="quote-total-row">
      <span id="quoteItemCountLabel">0 itens na lista</span>
    </div>
    <div class="quote-actions">
      <button class="quote-action-btn secondary" id="copyBtn">Copiar lista</button>
      <button class="quote-action-btn primary" id="whatsappBtn">Enviar via WhatsApp</button>
    </div>
    <div class="quote-note">Sem preço aqui — você recebe o orçamento certinho no WhatsApp.</div>
  </div>
</div>

<div id="printArea"></div>

</body>
</html>
